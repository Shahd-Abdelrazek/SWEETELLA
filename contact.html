<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Sweetella about orders, custom cakes and events.">
  <title>Sweetella</title>

  <script>
    try {
      var theme = localStorage.getItem("sweetella-theme");
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {}
  </script>
  <meta name="theme-color" content="#f86999">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/bootstrap.min.css" id="bootstrap-css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@500..700&family=Josefin+Sans:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="contact" data-title-key="nav.contact">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero-bg" style="background-image: url('images/pexels-brent-keane-181485-1702373.jpg')"></div>
      <div class="container page-hero-inner">
        <nav aria-label="breadcrumb">
          <ol class="sweet-breadcrumb">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li aria-current="page" data-i18n="nav.contact"></li>
          </ol>
        </nav>
        <p class="kicker" data-i18n="contact.kicker"></p>
        <h1 class="page-hero-title" data-i18n="contact.title"></h1>
        <p class="page-hero-sub" data-i18n="contact.subtitle"></p>
      </div>
    </section>

    <section class="section contact-section">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="contact-card reveal">
              <form id="contactForm" novalidate>
                <h2 class="contact-card-title" data-i18n="contact.formTitle"></h2>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="cName"><span data-i18n="contact.name"></span> <span class="req">*</span></label>
                    <div class="field"><i class="fa-regular fa-user" aria-hidden="true"></i><input class="form-control sweet-input" id="cName" name="name" autocomplete="name" required></div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="cPhone" data-i18n="contact.phone"></label>
                    <div class="field"><i class="fa-solid fa-phone" aria-hidden="true"></i><input class="form-control sweet-input" id="cPhone" name="phone" type="tel" autocomplete="tel" dir="ltr"></div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="cEmail"><span data-i18n="contact.email"></span> <span class="req">*</span></label>
                    <div class="field"><i class="fa-regular fa-envelope" aria-hidden="true"></i><input class="form-control sweet-input" id="cEmail" name="email" type="email" autocomplete="email" dir="ltr" required></div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="cCompany" data-i18n="contact.company"></label>
                    <div class="field"><i class="fa-regular fa-building" aria-hidden="true"></i><input class="form-control sweet-input" id="cCompany" name="company" autocomplete="organization"></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="cSubject"><span data-i18n="contact.subject"></span> <span class="req">*</span></label>
                    <div class="field"><i class="fa-solid fa-tag" aria-hidden="true"></i>
                    <select class="form-select sweet-input" id="cSubject" name="subject" required>
                      <option value="order" data-i18n="contact.subject.order"></option>
                      <option value="custom" data-i18n="contact.subject.custom"></option>
                      <option value="event" data-i18n="contact.subject.event"></option>
                      <option value="other" data-i18n="contact.subject.other"></option>
                    </select></div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="cMessage"><span data-i18n="contact.message"></span> <span class="req">*</span></label>
                    <textarea class="form-control sweet-input" id="cMessage" name="message" rows="6" required></textarea>
                  </div>
                </div>
                <div class="contact-actions">
                  <button type="submit" class="btn-sweet"><span data-i18n="contact.submit"></span> <i class="fa-solid fa-paper-plane flip-rtl" aria-hidden="true"></i></button>
                  <span class="req-note" data-i18n="contact.required"></span>
                </div>
              </form>

              <div class="contact-success" id="contactSuccess" hidden>
                <span class="success-icon"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
                <h2 data-i18n="contact.sentTitle"></h2>
                <p data-i18n="contact.sentText"></p>
                <p class="demo-note" data-i18n="contact.demo"></p>
                <button type="button" class="btn-sweet" id="contactAgain" data-i18n="contact.another"></button>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <aside class="contact-side reveal">
              <div class="side-brand">
                <img src="images/ChatGPT_Image_Jul_2__2025__10_43_21_PM-removebg-preview.png" alt="Sweetella logo">
                <div><h3>SWEETELLA</h3><p data-i18n="footer.company"></p></div>
              </div>
              <ul class="side-list">
                <li><span class="side-ic"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span><div><small data-i18n="footer.address"></small><strong data-i18n="footer.egypt"></strong></div></li>
                <li><span class="side-ic"><i class="fa-solid fa-phone" aria-hidden="true"></i></span><div><small data-i18n="footer.tel"></small><strong><bdi>000-000-000</bdi></strong></div></li>
                <li><span class="side-ic"><i class="fa-solid fa-fax" aria-hidden="true"></i></span><div><small data-i18n="footer.fax"></small><strong><bdi>000-000-000</bdi></strong></div></li>
              </ul>
              <p class="side-label" data-i18n="contact.follow"></p>
              <div class="side-social">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
                <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter" aria-hidden="true"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
              </div>
            </aside>

            <div class="map-card reveal">
              <p class="side-label"><i class="fa-solid fa-map-location-dot" aria-hidden="true"></i> <span data-i18n="contact.map"></span></p>
              <iframe title="Sweetella location map" src="https://maps.google.com/maps?q=Egypt&amp;z=5&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/track.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
