<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Read what Sweetella customers say and share your own review.">
  <title>Sweetella</title>

  <script>
    try {
      var theme = localStorage.getItem("sweetella-theme");
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {}
  </script>
  <meta name="theme-color" content="#f86999">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/bootstrap.min.css" id="bootstrap-css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@500..700&family=Josefin+Sans:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="feedback" data-title-key="nav.feedback">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero-bg" style="background-image: url('images/pexels-julias-torten-und-tortchen-434418-1120464.jpg')"></div>
      <div class="container page-hero-inner">
        <nav aria-label="breadcrumb">
          <ol class="sweet-breadcrumb">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li aria-current="page" data-i18n="nav.feedback"></li>
          </ol>
        </nav>
        <p class="kicker" data-i18n="fb.kicker"></p>
        <h1 class="page-hero-title" data-i18n="fb.title"></h1>
        <p class="page-hero-sub" data-i18n="fb.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row g-4 mb-5">
          <div class="col-lg-4">
            <div class="rating-summary reveal" id="ratingSummary">
              <p class="side-label" data-i18n="fb.average"></p>
              <div class="avg-number" data-avg>5.0</div>
              <div data-avg-stars></div>
              <p class="avg-count"><span data-count>0</span> <span data-i18n="fb.reviews"></span></p>
              <div class="bars">
                <div class="bar-row" data-bar="5"><span>5 <i class="fa-solid fa-star" aria-hidden="true"></i></span><div class="bar"><div class="bar-fill"></div></div><span class="bar-count">0</span></div>
                <div class="bar-row" data-bar="4"><span>4 <i class="fa-solid fa-star" aria-hidden="true"></i></span><div class="bar"><div class="bar-fill"></div></div><span class="bar-count">0</span></div>
                <div class="bar-row" data-bar="3"><span>3 <i class="fa-solid fa-star" aria-hidden="true"></i></span><div class="bar"><div class="bar-fill"></div></div><span class="bar-count">0</span></div>
                <div class="bar-row" data-bar="2"><span>2 <i class="fa-solid fa-star" aria-hidden="true"></i></span><div class="bar"><div class="bar-fill"></div></div><span class="bar-count">0</span></div>
                <div class="bar-row" data-bar="1"><span>1 <i class="fa-solid fa-star" aria-hidden="true"></i></span><div class="bar"><div class="bar-fill"></div></div><span class="bar-count">0</span></div>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <form class="feedback-form reveal" id="feedbackForm">
              <h2 class="contact-card-title" data-i18n="fb.formTitle"></h2>
              <div class="mb-3">
                <span class="form-label d-block" data-i18n="fb.rating"></span>
                <div class="star-input" role="radiogroup">
                  <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5/5"><i class="fa-solid fa-star" aria-hidden="true"></i><span class="visually-hidden">5/5</span></label>
                  <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4/5"><i class="fa-solid fa-star" aria-hidden="true"></i><span class="visually-hidden">4/5</span></label>
                  <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3/5"><i class="fa-solid fa-star" aria-hidden="true"></i><span class="visually-hidden">3/5</span></label>
                  <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2/5"><i class="fa-solid fa-star" aria-hidden="true"></i><span class="visually-hidden">2/5</span></label>
                  <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1/5"><i class="fa-solid fa-star" aria-hidden="true"></i><span class="visually-hidden">1/5</span></label>
                </div>
              </div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="reviewName" data-i18n="contact.name"></label>
                  <input class="form-control sweet-input" id="reviewName" name="reviewName" maxlength="40" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reviewItem" data-i18n="fb.item"></label>
                  <select class="form-select sweet-input" id="reviewItem" name="reviewItem">
                      <option value="birthday" data-i18n="cat.birthday"></option>
                      <option value="wedding" data-i18n="cat.wedding"></option>
                      <option value="cupcakes" data-i18n="cat.cupcakes"></option>
                      <option value="candies" data-i18n="cat.candies"></option>
                      <option value="donuts" data-i18n="cat.donuts"></option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="reviewText" data-i18n="fb.comment"></label>
                  <textarea class="form-control sweet-input" id="reviewText" name="reviewText" rows="3" maxlength="400" required></textarea>
                </div>
              </div>
              <div class="contact-actions">
                <button type="submit" class="btn-sweet"><span data-i18n="fb.submit"></span> <i class="fa-solid fa-heart" aria-hidden="true"></i></button>
                <span class="req-note" data-i18n="fb.localNote"></span>
              </div>
            </form>
          </div>
        </div>

        <div class="review-grid" id="reviewList"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/track.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
